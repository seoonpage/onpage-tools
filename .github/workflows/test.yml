name: Test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: node --test test/gate.test.mjs test/guard.test.mjs
  gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Good page passes
        uses: ./
        with:
          paths: "test/site/index.html"
          base-url: "https://acme.example"
          min-score: "80"
      - name: Bare page fails as expected
        id: bare
        continue-on-error: true
        uses: ./
        with:
          paths: "test/site/about/*.html"
          min-score: "80"
      - name: Check the bare page failed
        run: test "${{ steps.bare.outcome }}" = "failure"
